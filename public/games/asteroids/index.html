<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vector Asteroids</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 520px;
      max-width: 95vw;
      padding: 12px 18px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 700;
    }
    .hud span { color: #38bdf8; }
    #canvas {
      background: #060913;
      border: 1px solid #1f2937;
      border-top: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-radius: 0 0 8px 8px;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; max-width: 300px; }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #7dd3fc; transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">▲▲▲</span></div>
  </div>
  <canvas id="canvas" width="520" height="400"></canvas>
  <div class="controls-hint">← → Rotate · ↑ Thrust · Space to Shoot · H Hyperspace</div>

  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">VECTOR ASTEROIDS</h2>
    <p id="overlaySub">Navigate deep space, vaporize cosmic debris, and avoid collisions!</p>
    <button id="startBtn" class="btn">LAUNCH SHIP</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    let ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 10,
      a: -Math.PI / 2,
      rot: 0,
      thrusting: false,
      thrust: { x: 0, y: 0 }
    };

    let asteroids = [];
    let lasers = [];
    let score = 0;
    let lives = 3;
    let isRunning = false;
    const keys = {};

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function createAsteroid(x, y, r) {
      const lvl = r > 25 ? 3 : r > 15 ? 2 : 1;
      const speed = (4 - lvl) * 0.9;
      const angle = Math.random() * Math.PI * 2;
      return {
        x: x,
        y: y,
        xv: Math.cos(angle) * speed,
        yv: Math.sin(angle) * speed,
        r: r,
        vert: Math.floor(Math.random() * 4 + 7),
        offsets: Array.from({ length: 12 }, () => Math.random() * 0.4 + 0.8)
      };
    }

    function initGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '▲▲▲';
      lasers = [];
      asteroids = [];
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.thrust = { x: 0, y: 0 };
      ship.a = -Math.PI / 2;

      for (let i = 0; i < 5; i++) {
        let ax, ay;
        do {
          ax = Math.random() * canvas.width;
          ay = Math.random() * canvas.height;
        } while (Math.hypot(ax - ship.x, ay - ship.y) < 100);
        asteroids.push(createAsteroid(ax, ay, 35));
      }

      isRunning = true;
      overlay.style.display = 'none';
    }

    function shoot() {
      if (!isRunning || lasers.length > 5) return;
      lasers.push({
        x: ship.x + 4/3 * ship.r * Math.cos(ship.a),
        y: ship.y - 4/3 * ship.r * Math.sin(ship.a),
        xv: 7 * Math.cos(ship.a) + ship.thrust.x * 0.4,
        yv: -7 * Math.sin(ship.a) + ship.thrust.y * 0.4,
        dist: 0
      });
      playBeep(780, 'square', 0.05);
    }

    function hyperspace() {
      ship.x = Math.random() * (canvas.width - 40) + 20;
      ship.y = Math.random() * (canvas.height - 40) + 20;
      ship.thrust = { x: 0, y: 0 };
      playBeep(220, 'triangle', 0.15);
    }

    function update() {
      if (!isRunning) return;

      // Rotation
      if (keys['ArrowLeft'] || keys['a']) ship.a += 0.07;
      if (keys['ArrowRight'] || keys['d']) ship.a -= 0.07;

      // Thrust
      if (keys['ArrowUp'] || keys['w']) {
        ship.thrust.x += 0.12 * Math.cos(ship.a);
        ship.thrust.y -= 0.12 * Math.sin(ship.a);
        ship.thrusting = true;
      } else {
        ship.thrusting = false;
        ship.thrust.x *= 0.985;
        ship.thrust.y *= 0.985;
      }

      // Ship position
      ship.x += ship.thrust.x;
      ship.y += ship.thrust.y;

      // Screen wrap
      if (ship.x < 0) ship.x = canvas.width;
      if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      if (ship.y > canvas.height) ship.y = 0;

      // Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.xv;
        l.y += l.yv;
        l.dist += Math.hypot(l.xv, l.yv);

        if (l.x < 0) l.x = canvas.width;
        if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height;
        if (l.y > canvas.height) l.y = 0;

        if (l.dist > canvas.width * 0.7) {
          lasers.splice(i, 1);
          continue;
        }

        // Asteroid hit check
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            lasers.splice(i, 1);
            score += a.r > 25 ? 20 : a.r > 15 ? 50 : 100;
            scoreEl.textContent = score;
            playBeep(320, 'sine', 0.08);

            // Split asteroid
            if (a.r > 15) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
            }
            asteroids.splice(j, 1);
            break;
          }
        }
      }

      // Asteroid move & ship collision
      for (const a of asteroids) {
        a.x += a.xv;
        a.y += a.yv;

        if (a.x < 0 - a.r) a.x = canvas.width + a.r;
        if (a.x > canvas.width + a.r) a.x = 0 - a.r;
        if (a.y < 0 - a.r) a.y = canvas.height + a.r;
        if (a.y > canvas.height + a.r) a.y = 0 - a.r;

        // Collision with ship
        if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r) {
          lives--;
          livesEl.textContent = '▲'.repeat(Math.max(0, lives));
          playBeep(120, 'sawtooth', 0.3);
          if (lives <= 0) {
            gameOver();
            return;
          } else {
            hyperspace();
          }
        }
      }

      // If all cleared, spawn more
      if (asteroids.length === 0) {
        for (let i = 0; i < 6; i++) {
          asteroids.push(createAsteroid(Math.random() * canvas.width, Math.random() * canvas.height, 35));
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#060913';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ship
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(
        ship.x + 4/3 * ship.r * Math.cos(ship.a),
        ship.y - 4/3 * ship.r * Math.sin(ship.a)
      );
      ctx.lineTo(
        ship.x - ship.r * (2/3 * Math.cos(ship.a) + Math.sin(ship.a)),
        ship.y + ship.r * (2/3 * Math.sin(ship.a) - Math.cos(ship.a))
      );
      ctx.lineTo(
        ship.x - ship.r * (2/3 * Math.cos(ship.a) - Math.sin(ship.a)),
        ship.y + ship.r * (2/3 * Math.sin(ship.a) + Math.cos(ship.a))
      );
      ctx.closePath();
      ctx.stroke();

      // Thruster flame
      if (ship.thrusting) {
        ctx.strokeStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(
          ship.x - ship.r * (2/3 * Math.cos(ship.a) + 0.5 * Math.sin(ship.a)),
          ship.y + ship.r * (2/3 * Math.sin(ship.a) - 0.5 * Math.cos(ship.a))
        );
        ctx.lineTo(
          ship.x - ship.r * 5/3 * Math.cos(ship.a),
          ship.y + ship.r * 5/3 * Math.sin(ship.a)
        );
        ctx.lineTo(
          ship.x - ship.r * (2/3 * Math.cos(ship.a) - 0.5 * Math.sin(ship.a)),
          ship.y + ship.r * (2/3 * Math.sin(ship.a) + 0.5 * Math.cos(ship.a))
        );
        ctx.stroke();
      }

      // Lasers
      ctx.fillStyle = '#f43f5e';
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Asteroids
      ctx.strokeStyle = '#94a3b8';
      asteroids.forEach(a => {
        ctx.beginPath();
        for (let i = 0; i < a.vert; i++) {
          const angle = (i / a.vert) * Math.PI * 2;
          const rad = a.r * (a.offsets[i] || 1);
          const px = a.x + rad * Math.cos(angle);
          const py = a.y + rad * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      overlayTitle.textContent = 'SHIP DESTROYED';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = `Cosmic score: ${score}`;
      startBtn.textContent = 'RELAUNCH';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (['ArrowUp', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
      if (e.key === ' ' || e.code === 'Space') shoot();
      if (e.key === 'h' || e.key === 'H') hyperspace();
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    startBtn.addEventListener('click', initGame);

    loop();
  </script>
</body>
</html>
