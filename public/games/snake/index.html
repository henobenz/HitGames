<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: min(440px, 92vw, 54vh);
      padding: 10px 14px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: clamp(12px, 3vw, 14px);
      font-weight: 600;
    }
    .hud span { color: #10b981; }
    #canvas {
      display: block;
      width: min(440px, 92vw, 54vh);
      height: auto;
      aspect-ratio: 1 / 1;
      background: #0d1322;
      border: 1px solid #1f2937;
      border-top: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-radius: 0 0 8px 8px;
      touch-action: none;
    }
    .touch-controls {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 40px);
      gap: 5px;
    }
    .pad-btn {
      background: #111827;
      color: #e2e8f0;
      border: 1px solid #1f2937;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s, transform 0.08s;
    }
    .pad-btn:active, .pad-btn.pressed {
      background: #10b981;
      color: #042f2e;
      transform: scale(0.94);
    }
    .pause-btn {
      height: 44px;
      padding: 0 14px;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .overlay h2 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      max-width: 300px;
    }
    .btn {
      background: #10b981;
      color: #042f2e;
      border: none;
      padding: 12px 26px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      touch-action: manipulation;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #34d399; transform: scale(1.03); }
    .controls-hint {
      margin-top: 8px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>HIGH: <span id="highScore">0</span></div>
    <div>SPEED: <span id="speed">1x</span></div>
  </div>
  <canvas id="canvas" width="440" height="440"></canvas>

  <div class="touch-controls">
    <div class="dpad">
      <div></div>
      <button class="pad-btn" data-dir="up" aria-label="Move Up">▲</button>
      <div></div>
      <button class="pad-btn" data-dir="left" aria-label="Move Left">◀</button>
      <button class="pad-btn" data-dir="down" aria-label="Move Down">▼</button>
      <button class="pad-btn" data-dir="right" aria-label="Move Right">▶</button>
    </div>
    <button id="pauseBtn" class="pad-btn pause-btn" type="button">PAUSE</button>
  </div>

  <div class="controls-hint">Swipe Board, Tap D-Pad, or Arrow Keys / WASD · Space to Pause</div>

  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">RETRO SNAKE</h2>
    <p id="overlaySub">Eat the energy orbs and grow without hitting the wall or yourself!</p>
    <button id="startBtn" class="btn">START GAME</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('playvault_snake_high') || '0', 10);
    highScoreEl.textContent = highScore;

    let gameInterval = null;
    let isRunning = false;
    let isPaused = false;
    let speed = 115;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function unlockAudio() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      unlockAudio();
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      speed = 115;
      scoreEl.textContent = '0';
      speedEl.textContent = '1x';
      spawnFood();
      isRunning = true;
      isPaused = false;
      overlay.style.display = 'none';

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, speed);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function setDirection(dir) {
      if (!isRunning || isPaused) return;
      if (dir === 'up' && dy !== 1) {
        nextDx = 0; nextDy = -1;
      } else if (dir === 'down' && dy !== -1) {
        nextDx = 0; nextDy = 1;
      } else if (dir === 'left' && dx !== 1) {
        nextDx = -1; nextDy = 0;
      } else if (dir === 'right' && dx !== -1) {
        nextDx = 1; nextDy = 0;
      }
    }

    function togglePause() {
      if (!isRunning) {
        initGame();
        return;
      }
      isPaused = !isPaused;
      if (isPaused) {
        overlayTitle.textContent = 'PAUSED';
        overlayTitle.style.color = '#38bdf8';
        overlaySub.textContent = 'Press Space or Tap Resume';
        startBtn.textContent = 'RESUME';
        overlay.style.display = 'flex';
      } else {
        overlay.style.display = 'none';
      }
    }

    function gameLoop() {
      if (isPaused) return;
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playBeep(520, 'square', 0.1);

        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('playvault_snake_high', highScore.toString());
        }

        if (score % 50 === 0 && speed > 50) {
          speed -= 8;
          speedEl.textContent = ((115 / speed).toFixed(1)) + 'x';
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, speed);
        }

        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0d1322';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#151f33';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2 - 2, food.y * GRID_SIZE + GRID_SIZE/2 - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);

          ctx.fillStyle = '#042f2e';
          const eyeSize = 3;
          let e1x = segment.x * GRID_SIZE + 4;
          let e1y = segment.y * GRID_SIZE + 4;
          let e2x = segment.x * GRID_SIZE + 12;
          let e2y = segment.y * GRID_SIZE + 4;
          if (dy !== 0) {
            e1x = segment.x * GRID_SIZE + 4;
            e2x = segment.x * GRID_SIZE + 12;
            e1y = e2y = segment.y * GRID_SIZE + (dy > 0 ? 12 : 4);
          } else {
            e1y = segment.y * GRID_SIZE + 4;
            e2y = segment.y * GRID_SIZE + 12;
            e1x = e2x = segment.x * GRID_SIZE + (dx > 0 ? 12 : 4);
          }
          ctx.fillRect(e1x, e1y, eyeSize, eyeSize);
          ctx.fillRect(e2x, e2y, eyeSize, eyeSize);
        } else {
          const ratio = (snake.length - index) / snake.length;
          ctx.fillStyle = `rgb(5, ${Math.floor(130 + 50 * ratio)}, ${Math.floor(90 + 30 * ratio)})`;
          ctx.fillRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        }
      });
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      playBeep(180, 'sawtooth', 0.25);
      setTimeout(() => playBeep(120, 'sawtooth', 0.4), 180);

      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = `You scored ${score} points! Best: ${highScore}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === ' ' || e.code === 'Space') {
        togglePause();
        return;
      }

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDirection('up');
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDirection('down');
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDirection('left');
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDirection('right');
    });

    // Touch D-Pad buttons
    document.querySelectorAll('.pad-btn[data-dir]').forEach(btn => {
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        unlockAudio();
        setDirection(btn.dataset.dir);
      });
    });

    pauseBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      unlockAudio();
      togglePause();
    });

    // Swipe gestures on canvas
    let touchStartX = null;
    let touchStartY = null;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      unlockAudio();
      if (e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (touchStartX === null || touchStartY === null || e.touches.length === 0) return;
      const cx = e.touches[0].clientX;
      const cy = e.touches[0].clientY;
      const ddx = cx - touchStartX;
      const ddy = cy - touchStartY;
      if (Math.max(Math.abs(ddx), Math.abs(ddy)) >= 22) {
        if (Math.abs(ddx) > Math.abs(ddy)) {
          setDirection(ddx > 0 ? 'right' : 'left');
        } else {
          setDirection(ddy > 0 ? 'down' : 'up');
        }
        touchStartX = cx;
        touchStartY = cy;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      touchStartX = null;
      touchStartY = null;
    });

    startBtn.addEventListener('click', () => {
      if (isPaused) {
        isPaused = false;
        overlay.style.display = 'none';
      } else {
        initGame();
      }
    });

    draw();
  </script>
</body>
</html>
