<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 440px;
      max-width: 95vw;
      padding: 12px 16px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 600;
    }
    .hud span { color: #10b981; }
    #canvas {
      background: #0d1322;
      border: 1px solid #1f2937;
      border-top: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-radius: 0 0 8px 8px;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay h2 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn {
      background: #10b981;
      color: #042f2e;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #34d399; transform: scale(1.03); }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>HIGH: <span id="highScore">0</span></div>
    <div>SPEED: <span id="speed">1x</span></div>
  </div>
  <canvas id="canvas" width="440" height="440"></canvas>
  <div class="controls-hint">Use Arrow Keys or WASD to Move · Space to Pause</div>

  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">RETRO SNAKE</h2>
    <p id="overlaySub">Eat the energy orbs and grow without hitting the wall or yourself!</p>
    <button id="startBtn" class="btn">START GAME</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('playvault_snake_high') || '0', 10);
    highScoreEl.textContent = highScore;

    let gameInterval = null;
    let isRunning = false;
    let isPaused = false;
    let speed = 110;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      speed = 115;
      scoreEl.textContent = '0';
      speedEl.textContent = '1x';
      spawnFood();
      isRunning = true;
      isPaused = false;
      overlay.style.display = 'none';

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, speed);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function gameLoop() {
      if (isPaused) return;
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playBeep(520, 'square', 0.1);

        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('playvault_snake_high', highScore.toString());
        }

        // Increase speed slightly
        if (score % 50 === 0 && speed > 50) {
          speed -= 8;
          speedEl.textContent = ((115 / speed).toFixed(1)) + 'x';
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, speed);
        }

        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#0d1322';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#151f33';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Food glow
      ctx.fillStyle = '#f87171';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2 - 2, food.y * GRID_SIZE + GRID_SIZE/2 - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981';
          ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
          
          // Eye dots
          ctx.fillStyle = '#042f2e';
          const eyeSize = 3;
          let e1x = segment.x * GRID_SIZE + 4;
          let e1y = segment.y * GRID_SIZE + 4;
          let e2x = segment.x * GRID_SIZE + 12;
          let e2y = segment.y * GRID_SIZE + 4;
          if (dy !== 0) {
            e1x = segment.x * GRID_SIZE + 4;
            e2x = segment.x * GRID_SIZE + 12;
            e1y = e2y = segment.y * GRID_SIZE + (dy > 0 ? 12 : 4);
          } else {
            e1y = segment.y * GRID_SIZE + 4;
            e2y = segment.y * GRID_SIZE + 12;
            e1x = e2x = segment.x * GRID_SIZE + (dx > 0 ? 12 : 4);
          }
          ctx.fillRect(e1x, e1y, eyeSize, eyeSize);
          ctx.fillRect(e2x, e2y, eyeSize, eyeSize);
        } else {
          const ratio = (snake.length - index) / snake.length;
          ctx.fillStyle = `rgb(5, ${Math.floor(130 + 50 * ratio)}, ${Math.floor(90 + 30 * ratio)})`;
          ctx.fillRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        }
      });
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      playBeep(180, 'sawtooth', 0.25);
      setTimeout(() => playBeep(120, 'sawtooth', 0.4), 180);

      overlayTitle.textContent = 'GAME OVER';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = `You scored ${score} points! Best: ${highScore}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      if (e.key === ' ' || e.code === 'Space') {
        if (!isRunning) {
          initGame();
        } else {
          isPaused = !isPaused;
          if (isPaused) {
            overlayTitle.textContent = 'PAUSED';
            overlayTitle.style.color = '#38bdf8';
            overlaySub.textContent = 'Press Space to Resume';
            startBtn.textContent = 'RESUME';
            overlay.style.display = 'flex';
          } else {
            overlay.style.display = 'none';
          }
        }
        return;
      }

      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && dy !== 1) {
        nextDx = 0; nextDy = -1;
      } else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && dy !== -1) {
        nextDx = 0; nextDy = 1;
      } else if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && dx !== 1) {
        nextDx = -1; nextDy = 0;
      } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && dx !== -1) {
        nextDx = 1; nextDy = 0;
      }
    });

    startBtn.addEventListener('click', () => {
      if (isPaused) {
        isPaused = false;
        overlay.style.display = 'none';
      } else {
        initGame();
      }
    });

    draw();
  </script>
</body>
</html>
