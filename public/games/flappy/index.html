<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Copter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 360px;
      max-width: 95vw;
      padding: 12px 18px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 700;
    }
    .hud span { color: #38bdf8; }
    #canvas {
      background: #0b172a;
      border: 1px solid #1f2937;
      border-top: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-radius: 0 0 8px 8px;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; max-width: 280px; }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #7dd3fc; transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="highScore">0</span></div>
  </div>
  <canvas id="canvas" width="360" height="480"></canvas>
  <div class="controls-hint">Tap Space or Click to Flap</div>

  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">FLAPPY COPTER</h2>
    <p id="overlaySub">Tap or press Space to hover through the neon barriers!</p>
    <button id="startBtn" class="btn">START GAME</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    let birdY = canvas.height / 2;
    let birdVelocity = 0;
    const GRAVITY = 0.32;
    const JUMP = -6.2;
    const BIRD_RADIUS = 13;

    let pipes = [];
    const PIPE_WIDTH = 50;
    const PIPE_GAP = 125;
    let pipeSpawnTimer = 0;

    let score = 0;
    let highScore = parseInt(localStorage.getItem('playvault_flappy_high') || '0', 10);
    highScoreEl.textContent = highScore;
    let isRunning = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      birdY = canvas.height / 2;
      birdVelocity = 0;
      pipes = [];
      pipeSpawnTimer = 0;
      score = 0;
      scoreEl.textContent = '0';
      isRunning = true;
      overlay.style.display = 'none';
    }

    function flap() {
      if (!isRunning) return;
      birdVelocity = JUMP;
      playBeep(400, 'sine', 0.06);
    }

    function spawnPipe() {
      const minTop = 60;
      const maxTop = canvas.height - PIPE_GAP - 60;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: topHeight + PIPE_GAP,
        passed: false
      });
    }

    function update() {
      if (!isRunning) return;

      birdVelocity += GRAVITY;
      birdY += birdVelocity;

      // Ground or ceiling
      if (birdY + BIRD_RADIUS >= canvas.height || birdY - BIRD_RADIUS <= 0) {
        gameOver();
        return;
      }

      // Spawn pipes
      pipeSpawnTimer++;
      if (pipeSpawnTimer > 95) {
        spawnPipe();
        pipeSpawnTimer = 0;
      }

      // Move pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.4;

        // Collision detection
        if (
          canvas.width / 3 + BIRD_RADIUS > p.x &&
          canvas.width / 3 - BIRD_RADIUS < p.x + PIPE_WIDTH
        ) {
          if (birdY - BIRD_RADIUS < p.top || birdY + BIRD_RADIUS > p.bottom) {
            gameOver();
            return;
          }
        }

        // Passed pipe
        if (!p.passed && p.x + PIPE_WIDTH < canvas.width / 3) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          playBeep(580, 'square', 0.08);

          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem('playvault_flappy_high', highScore.toString());
          }
        }

        if (p.x + PIPE_WIDTH < 0) {
          pipes.splice(i, 1);
        }
      }
    }

    function draw() {
      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0b1329');
      grad.addColorStop(1, '#020617');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant stars / lights
      ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.fillRect(40, 80, 2, 2);
      ctx.fillRect(180, 50, 2, 2);
      ctx.fillRect(290, 110, 2, 2);
      ctx.fillRect(110, 200, 2, 2);

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x - 3, p.top - 16, PIPE_WIDTH + 6, 16);

        // Bottom pipe
        ctx.fillStyle = '#059669';
        ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, canvas.height - p.bottom);
        ctx.fillStyle = '#10b981';
        ctx.fillRect(p.x - 3, p.bottom, PIPE_WIDTH + 6, 16);
      });

      // Bird
      const bx = canvas.width / 3;
      ctx.save();
      ctx.translate(bx, birdY);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, birdVelocity * 0.08));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, 0, BIRD_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(9, -1);
      ctx.lineTo(17, 2);
      ctx.lineTo(9, 5);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      playBeep(160, 'sawtooth', 0.25);
      overlayTitle.textContent = 'CRASH!';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = `You scored ${score} points! Best: ${highScore}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        flap();
      }
    });
    canvas.addEventListener('mousedown', flap);
    startBtn.addEventListener('click', initGame);

    loop();
  </script>
</body>
</html>
