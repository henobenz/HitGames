<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tower Stack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 360px;
      max-width: 95vw;
      padding: 12px 18px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px 8px 0 0;
      font-size: 14px;
      font-weight: 700;
    }
    .hud span { color: #f59e0b; }
    #canvas {
      background: #0b1120;
      border: 1px solid #1f2937;
      border-top: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border-radius: 0 0 8px 8px;
      cursor: pointer;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .overlay h2 { font-size: 28px; margin-bottom: 8px; color: #f59e0b; }
    .overlay p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; text-align: center; max-width: 280px; }
    .btn {
      background: #f59e0b;
      color: #451a03;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.1s, background 0.15s;
    }
    .btn:hover { background: #fbbf24; transform: scale(1.03); }
  </style>
</head>
<body>
  <div class="hud">
    <div>STACK: <span id="score">0</span></div>
    <div>BEST: <span id="highScore">0</span></div>
  </div>
  <canvas id="canvas" width="360" height="460"></canvas>
  <div class="controls-hint">Tap / Click or Space to Drop Slab</div>

  <div id="overlay" class="overlay">
    <h2 id="overlayTitle">TOWER STACK</h2>
    <p id="overlaySub">Time your drop precisely to build the tallest architectural skyscraper!</p>
    <button id="startBtn" class="btn">START STACKING</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const SLAB_HEIGHT = 16;
    let stack = [];
    let currentSlab = null;
    let slabSpeed = 3;
    let slabDirection = 1;
    let score = 0;
    let combo = 0;
    let highScore = parseInt(localStorage.getItem('playvault_stack_high') || '0', 10);
    highScoreEl.textContent = highScore;
    let isRunning = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function getColor(level) {
      const hue = (level * 18 + 160) % 360;
      return `hsl(${hue}, 70%, 55%)`;
    }

    function initGame() {
      score = 0;
      combo = 0;
      scoreEl.textContent = '0';
      stack = [
        { x: 80, width: 200, y: canvas.height - 40, color: getColor(0) }
      ];
      spawnNextSlab();
      isRunning = true;
      overlay.style.display = 'none';
    }

    function spawnNextSlab() {
      const prev = stack[stack.length - 1];
      const level = stack.length;
      currentSlab = {
        x: 0,
        width: prev.width,
        y: prev.y - SLAB_HEIGHT,
        color: getColor(level)
      };
      slabDirection = 1;
      slabSpeed = 2.8 + Math.min(3, level * 0.08);
    }

    function dropSlab() {
      if (!isRunning || !currentSlab) return;

      const prev = stack[stack.length - 1];
      const diff = currentSlab.x - prev.x;

      if (Math.abs(diff) < 3) {
        // Perfect match
        currentSlab.x = prev.x;
        combo++;
        playBeep(440 + combo * 60, 'sine', 0.12);
      } else {
        combo = 0;
        if (diff > 0) {
          // Overhang right
          currentSlab.width -= diff;
        } else {
          // Overhang left
          currentSlab.width += diff;
          currentSlab.x = prev.x;
        }
        playBeep(320, 'triangle', 0.08);
      }

      if (currentSlab.width <= 0) {
        gameOver();
        return;
      }

      stack.push(currentSlab);
      score++;
      scoreEl.textContent = score;

      if (score > highScore) {
        highScore = score;
        highScoreEl.textContent = highScore;
        localStorage.setItem('playvault_stack_high', highScore.toString());
      }

      // Camera shift down if stack exceeds half screen
      if (currentSlab.y < canvas.height / 2) {
        const offset = SLAB_HEIGHT;
        stack.forEach(s => s.y += offset);
      }

      spawnNextSlab();
    }

    function update() {
      if (!isRunning || !currentSlab) return;

      currentSlab.x += slabSpeed * slabDirection;
      if (currentSlab.x + currentSlab.width >= canvas.width) {
        slabDirection = -1;
      } else if (currentSlab.x <= 0) {
        slabDirection = 1;
      }
    }

    function draw() {
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stack
      stack.forEach((s) => {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.width, SLAB_HEIGHT - 1);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(s.x, s.y, s.width, 2);
      });

      // Moving slab
      if (currentSlab) {
        ctx.fillStyle = currentSlab.color;
        ctx.fillRect(currentSlab.x, currentSlab.y, currentSlab.width, SLAB_HEIGHT - 1);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(currentSlab.x, currentSlab.y, currentSlab.width, 3);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function gameOver() {
      isRunning = false;
      playBeep(150, 'sawtooth', 0.3);
      overlayTitle.textContent = 'TOWER COLLAPSED';
      overlayTitle.style.color = '#ef4444';
      overlaySub.textContent = `You reached level ${score}! Best: ${highScore}`;
      startBtn.textContent = 'BUILD AGAIN';
      overlay.style.display = 'flex';
    }

    canvas.addEventListener('click', dropSlab);
    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        dropSlab();
      }
    });

    startBtn.addEventListener('click', initGame);

    loop();
  </script>
</body>
</html>
