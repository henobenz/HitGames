<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Guess</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
      touch-action: manipulation;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
      text-align: center;
    }
    .header h1 {
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 800;
      color: #10b981;
      letter-spacing: 2px;
    }
    .new-btn {
      background: #111827;
      color: #34d399;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .new-btn:active { background: #064e3b; }
    .board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 12px;
    }
    .board-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .tile {
      width: clamp(38px, 11.5vw, 46px);
      height: clamp(38px, 11.5vw, 46px);
      border: 2px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(18px, 5vw, 22px);
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 6px;
      background: #0d1322;
      transition: transform 0.15s, background-color 0.25s, border-color 0.25s;
    }
    .tile.active { border-color: #38bdf8; transform: scale(1.04); }
    .tile.correct { background: #059669; border-color: #059669; color: #fff; }
    .tile.present { background: #d97706; border-color: #d97706; color: #fff; }
    .tile.absent { background: #374151; border-color: #374151; color: #9ca3af; }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      max-width: 420px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key-btn {
      flex: 1;
      min-width: 0;
      max-width: 38px;
      background: #1e293b;
      color: #f8fafc;
      border: none;
      border-radius: 5px;
      height: clamp(38px, 6.5vh, 44px);
      padding: 0 2px;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s;
    }
    .key-btn.wide { flex: 1.5; max-width: 60px; font-size: 11px; }
    .key-btn:hover { background: #334155; }
    .key-btn:active { transform: scale(0.95); }
    .key-btn.correct { background: #059669; }
    .key-btn.present { background: #d97706; }
    .key-btn.absent { background: #1f2937; color: #64748b; }

    .message {
      min-height: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>WORD GUESS</h1>
    <button id="newGameBtn" class="new-btn" type="button">NEW WORD</button>
  </div>
  <div id="message" class="message">Guess the secret 5-letter word!</div>
  <div id="board" class="board"></div>
  <div id="keyboard" class="keyboard"></div>

  <script>
    const WORDS = [
      'GAMES', 'VAULT', 'CYBER', 'PIXEL', 'QUEST', 'STAGE', 'POWER', 'SCORE',
      'SPACE', 'LASER', 'SWORD', 'MAGIC', 'LEVEL', 'BRICK', 'SNAKE', 'ARENA',
      'CHAMP', 'SPEED', 'TURBO', 'RETRO', 'FLASH', 'SHOCK', 'RADAR', 'BLAST'
    ];

    let secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
    let currentRow = 0;
    let currentCol = 0;
    let gameOver = false;
    let guesses = Array.from({ length: 6 }, () => Array(5).fill(''));

    const boardEl = document.getElementById('board');
    const kbEl = document.getElementById('keyboard');
    const msgEl = document.getElementById('message');
    const newGameBtn = document.getElementById('newGameBtn');

    const KB_ROWS = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
    ];

    function buildUI() {
      boardEl.innerHTML = '';
      for (let r = 0; r < 6; r++) {
        const row = document.createElement('div');
        row.className = 'board-row';
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }

      kbEl.innerHTML = '';
      KB_ROWS.forEach(rowArr => {
        const row = document.createElement('div');
        row.className = 'kb-row';
        rowArr.forEach(key => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'key-btn' + (key.length > 1 ? ' wide' : '');
          btn.textContent = key;
          btn.dataset.key = key;
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            handleKey(key);
          });
          row.appendChild(btn);
        });
        kbEl.appendChild(row);
      });
    }

    function resetGame() {
      secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
      currentRow = 0;
      currentCol = 0;
      gameOver = false;
      guesses = Array.from({ length: 6 }, () => Array(5).fill(''));
      buildUI();
      showMessage('Guess the secret 5-letter word!');
    }

    function showMessage(text, color = '#f59e0b') {
      msgEl.textContent = text;
      msgEl.style.color = color;
    }

    function handleKey(key) {
      if (gameOver) return;

      if (key === 'ENTER') {
        submitGuess();
      } else if (key === 'DEL' || key === 'BACKSPACE') {
        deleteLetter();
      } else if (/^[A-Z]$/.test(key)) {
        addLetter(key);
      }
    }

    function addLetter(letter) {
      if (currentCol < 5) {
        guesses[currentRow][currentCol] = letter;
        const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
        tile.textContent = letter;
        tile.classList.add('active');
        currentCol++;
      }
    }

    function deleteLetter() {
      if (currentCol > 0) {
        currentCol--;
        guesses[currentRow][currentCol] = '';
        const tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
        tile.textContent = '';
        tile.classList.remove('active');
      }
    }

    function submitGuess() {
      if (currentCol < 5) {
        showMessage('Not enough letters!');
        return;
      }

      const guess = guesses[currentRow].join('');
      const secretArr = secretWord.split('');
      const result = Array(5).fill('absent');
      const letterCounts = {};

      secretArr.forEach(l => { letterCounts[l] = (letterCounts[l] || 0) + 1; });

      for (let i = 0; i < 5; i++) {
        if (guess[i] === secretArr[i]) {
          result[i] = 'correct';
          letterCounts[guess[i]]--;
        }
      }

      for (let i = 0; i < 5; i++) {
        if (result[i] === 'absent' && letterCounts[guess[i]] > 0) {
          result[i] = 'present';
          letterCounts[guess[i]]--;
        }
      }

      for (let i = 0; i < 5; i++) {
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        tile.classList.remove('active');
        tile.classList.add(result[i]);

        const keyBtn = kbEl.querySelector(`[data-key="${guess[i]}"]`);
        if (keyBtn) {
          if (result[i] === 'correct') {
            keyBtn.className = 'key-btn correct';
          } else if (result[i] === 'present' && !keyBtn.classList.contains('correct')) {
            keyBtn.className = 'key-btn present';
          } else if (result[i] === 'absent' && !keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
            keyBtn.className = 'key-btn absent';
          }
        }
      }

      if (guess === secretWord) {
        gameOver = true;
        showMessage(`Splendid! Solved in ${currentRow + 1} guesses!`, '#10b981');
        return;
      }

      currentRow++;
      currentCol = 0;

      if (currentRow === 6) {
        gameOver = true;
        showMessage(`Game Over! The word was: ${secretWord}`, '#ef4444');
      }
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (key === 'ENTER' || key === 'BACKSPACE' || /^[A-Z]$/.test(key)) {
        handleKey(key);
      }
    });

    newGameBtn.addEventListener('click', resetGame);
    buildUI();
  </script>
</body>
</html>
