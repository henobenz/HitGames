<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minesweeper Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body {
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 8px;
      touch-action: manipulation;
    }
    .game-window {
      background: #111827;
      border: 2px solid #1f2937;
      border-radius: 8px;
      padding: clamp(10px, 3vw, 16px);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      max-width: 96vw;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1322;
      border: 1px solid #1f2937;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      gap: 8px;
    }
    .lcd {
      background: #030712;
      color: #ef4444;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(18px, 5vw, 22px);
      font-weight: 800;
      letter-spacing: 2px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
      min-width: 54px;
      text-align: center;
    }
    .face-btn {
      font-size: 22px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1;
      height: 36px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0d1322;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .mode-btn.active-reveal {
      background: #064e3b;
      border-color: #10b981;
      color: #6ee7b7;
    }
    .mode-btn.active-flag {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
    }
    .grid {
      display: grid;
      gap: 2px;
      background: #0d1322;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid #1f2937;
    }
    .cell {
      width: clamp(28px, 9.2vw, 34px);
      height: clamp(28px, 9.2vw, 34px);
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(13px, 4vw, 16px);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #374151; }
    .cell.revealed {
      background: #0d1322;
      border-color: #111827;
      cursor: default;
    }
    .cell.mine { background: #dc2626 !important; }
    .n-1 { color: #38bdf8; }
    .n-2 { color: #22c55e; }
    .n-3 { color: #ef4444; }
    .n-4 { color: #818cf8; }
    .n-5 { color: #b91c1c; }
    .n-6 { color: #06b6d4; }
    .controls-hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-window">
    <div class="hud">
      <div id="mineLcd" class="lcd">010</div>
      <button id="faceBtn" class="face-btn" type="button" aria-label="Restart">🙂</button>
      <div id="timeLcd" class="lcd">000</div>
    </div>
    <div class="mode-bar">
      <button id="revealModeBtn" class="mode-btn active-reveal" type="button">⛏ REVEAL MODE</button>
      <button id="flagModeBtn" class="mode-btn" type="button">🚩 FLAG MODE</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="controls-hint">Tap Mode Above · Long Press or Right Click: Flag 🚩</div>
  </div>

  <script>
    const ROWS = 9;
    const COLS = 9;
    const MINES = 10;

    let board = [];
    let minePositions = new Set();
    let revealedCount = 0;
    let flags = new Set();
    let gameOver = false;
    let timer = 0;
    let timerInterval = null;
    let flagMode = false;

    const gridEl = document.getElementById('grid');
    const mineLcd = document.getElementById('mineLcd');
    const timeLcd = document.getElementById('timeLcd');
    const faceBtn = document.getElementById('faceBtn');
    const revealModeBtn = document.getElementById('revealModeBtn');
    const flagModeBtn = document.getElementById('flagModeBtn');

    gridEl.style.gridTemplateColumns = `repeat(${COLS}, clamp(28px, 9.2vw, 34px))`;

    function setMode(isFlag) {
      flagMode = isFlag;
      revealModeBtn.className = 'mode-btn' + (!flagMode ? ' active-reveal' : '');
      flagModeBtn.className = 'mode-btn' + (flagMode ? ' active-flag' : '');
    }

    revealModeBtn.addEventListener('click', () => setMode(false));
    flagModeBtn.addEventListener('click', () => setMode(true));

    function init() {
      gameOver = false;
      revealedCount = 0;
      flags.clear();
      minePositions.clear();
      clearInterval(timerInterval);
      timer = 0;
      timeLcd.textContent = '000';
      faceBtn.textContent = '🙂';
      mineLcd.textContent = String(MINES).padStart(3, '0');

      board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      gridEl.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;

          let pressTimer = null;
          let longPressed = false;

          cell.addEventListener('touchstart', () => {
            longPressed = false;
            pressTimer = setTimeout(() => {
              longPressed = true;
              toggleFlag(r, c);
            }, 420);
          }, { passive: true });

          cell.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
          });
          cell.addEventListener('touchmove', () => {
            clearTimeout(pressTimer);
          }, { passive: true });

          cell.addEventListener('click', (e) => {
            if (longPressed) {
              longPressed = false;
              e.preventDefault();
              return;
            }
            if (flagMode) {
              toggleFlag(r, c);
            } else {
              reveal(r, c);
            }
          });

          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          gridEl.appendChild(cell);
        }
      }
    }

    function plantMines(firstR, firstC) {
      while (minePositions.size < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
        minePositions.add(`${r},${c}`);
      }

      for (const pos of minePositions) {
        const [mr, mc] = pos.split(',').map(Number);
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = mr + dr;
            const nc = mc + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              board[nr][nc]++;
            }
          }
        }
      }

      timerInterval = setInterval(() => {
        timer = Math.min(999, timer + 1);
        timeLcd.textContent = String(timer).padStart(3, '0');
      }, 1000);
    }

    function toggleFlag(r, c) {
      if (gameOver) return;
      const key = `${r},${c}`;
      const cell = gridEl.children[r * COLS + c];
      if (cell.classList.contains('revealed')) return;

      if (flags.has(key)) {
        flags.delete(key);
        cell.textContent = '';
      } else {
        if (flags.size >= MINES) return;
        flags.add(key);
        cell.textContent = '🚩';
      }
      mineLcd.textContent = String(MINES - flags.size).padStart(3, '0');
    }

    function reveal(r, c) {
      if (gameOver || flags.has(`${r},${c}`)) return;

      if (minePositions.size === 0) {
        plantMines(r, c);
      }

      const cell = gridEl.children[r * COLS + c];
      if (cell.classList.contains('revealed')) return;

      const isMine = minePositions.has(`${r},${c}`);
      if (isMine) {
        triggerGameOver(r, c);
        return;
      }

      cell.classList.add('revealed');
      revealedCount++;
      const val = board[r][c];

      if (val > 0) {
        cell.textContent = val;
        cell.classList.add(`n-${val}`);
      } else {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              reveal(nr, nc);
            }
          }
        }
      }

      if (revealedCount === ROWS * COLS - MINES) {
        win();
      }
    }

    function triggerGameOver() {
      gameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = '😵';

      minePositions.forEach(pos => {
        const [mr, mc] = pos.split(',').map(Number);
        const c = gridEl.children[mr * COLS + mc];
        c.classList.add('revealed', 'mine');
        c.textContent = '💣';
      });
    }

    function win() {
      gameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = '😎';
      minePositions.forEach(pos => {
        const [mr, mc] = pos.split(',').map(Number);
        const c = gridEl.children[mr * COLS + mc];
        c.textContent = '🚩';
      });
    }

    faceBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
