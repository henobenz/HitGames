<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <radialGradient id="ttt-bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#04050f" stop-opacity="0" />
    </radialGradient>
    <filter id="ttt-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="320" height="200" fill="#050716" />
  <rect width="320" height="200" fill="url(#ttt-bg)" />

  <!-- 3x3 Neon Board Frame -->
  <rect x="85" y="25" width="150" height="150" rx="14" fill="#090d24" stroke="#6366f1" stroke-opacity="0.65" stroke-width="2" />
  <g stroke="#4f46e5" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round">
    <line x1="135" y1="35" x2="135" y2="165" />
    <line x1="185" y1="35" x2="185" y2="165" />
    <line x1="95" y1="75" x2="225" y2="75" />
    <line x1="95" y1="125" x2="225" y2="125" />
  </g>

  <!-- Winning Diagonal Glow -->
  <g filter="url(#ttt-glow)">
    <line x1="99" y1="39" x2="221" y2="161" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" />

    <!-- Cyan X Marks (Top-Left, Center, Bottom-Right) -->
    <g stroke="#22d3ee" stroke-width="5" stroke-linecap="round">
      <line x1="100" y1="40" x2="120" y2="60" />
      <line x1="120" y1="40" x2="100" y2="60" />

      <line x1="150" y1="90" x2="170" y2="110" />
      <line x1="170" y1="90" x2="150" y2="110" />

      <line x1="200" y1="140" x2="220" y2="160" />
      <line x1="220" y1="140" x2="200" y2="160" />
    </g>

    <!-- Purple O Marks (Top-Right, Bottom-Left) -->
    <g stroke="#a855f7" stroke-width="5">
      <circle cx="210" cy="50" r="11" />
      <circle cx="110" cy="150" r="11" />
      <circle cx="160" cy="50" r="11" stroke-opacity="0.85" />
    </g>
  </g>
</svg>
